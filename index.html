* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 100px;
}

header {
  padding: 20px 16px 12px;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.cart-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.2s;
}

.cart-btn:hover { background: var(--card); }

.cart-count {
  background: var(--accent);
  color: white;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.banner {
  margin: 16px;
  background: linear-gradient(135deg, #1e3a5f, #1a1a2e);
  border-radius: 16px;
  padding: 24px 20px;
  border: 1px solid #2a3f6f;
  position: relative;
  overflow: hidden;
}

.banner::after {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(59,130,246,0.15);
}

.banner h2 {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 6px;
}

.banner p {
  color: #94a3b8;
  font-size: 13px;
}

.badge {
  display: inline-block;
  background: var(--accent);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  padding: 16px 16px 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 16px;
}

.card {
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: transform 0.2s;
  cursor: pointer;
  animation: fadeUp 0.4s ease both;
}

.card:active { transform: scale(0.97); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.1s; }
.card:nth-child(3) { animation-delay: 0.15s; }
.card:nth-child(4) { animation-delay: 0.2s; }
.card:nth-child(5) { animation-delay: 0.25s; }
.card:nth-child(6) { animation-delay: 0.3s; }

.card-img {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
}

.card-body {
  padding: 10px 12px 12px;
}

.card-name {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 4px;
  line-height: 1.3;
}

.card-desc {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 10px;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.price {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 800;
  color: var(--accent2);
}

.add-btn {
  background: var(--accent);
  border: none;
  color: white;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.add-btn:active { transform: scale(0.9); background: #2563eb; }

/* Cart modal */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  align-items: flex-end;
}

.overlay.open { display: flex; }

.cart-panel {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px 16px 32px;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.cart-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
}

.close-btn {
  background: var(--card);
  border: none;
  color: var(--text);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.cart-item-emoji { font-size: 32px; }
.cart-item-info { flex: 1; }
.cart-item-name { font-weight: 500; font-size: 14px; }
.cart-item-price { color: var(--accent2); font-size: 13px; }

.qty-ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
}

.qty-btn {
  background: var(--card);
  border: none;
  color: var(--text);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qty-num { font-weight: 700; font-size: 14px; min-width: 16px; text-align: center; }

.empty-cart {
  text-align: center;
  padding: 40px 0;
  color: var(--muted);
  font-size: 14px;
}

.empty-cart .icon { font-size: 48px; margin-bottom: 12px; }

.cart-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0 0;
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 800;
}

.checkout-btn {
  width: 100%;
  margin-top: 16px;
  background: var(--accent);
  color: white;
  border: none;
  padding: 16px;
  border-radius: 14px;
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}

.checkout-btn:active { background: #2563eb; }

<body>

<header>
  <div class="logo">🗂️ Fichesitsu</div>
  <button class="cart-btn" onclick="openCart()">
    🛒 Panier
    <span class="cart-count" id="cartCount">0</span>
  </button>
</header>

<div class="banner">
  <div class="badge">📦 VENTE PAR 1000</div>
  <h2>Fiches de qualité premium</h2>
  <p>Plusieurs couleurs & motifs disponibles · Livraison rapide</p>
</div>

<div class="section-title">Nos fiches</div>

<div class="grid" id="productsGrid"></div>

<div class="overlay" id="cartOverlay" onclick="handleOverlayClick(event)">
  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <div class="cart-title">🛒 Mon Panier</div>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div id="cartItems"></div>
    <div id="cartFooter"></div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const products = [
    { id: 1, name: "Fiches SG", desc: "1k/Societe_General", price: 25.00, img: "https://github.com/cmxuhq/monshop/blob/main/images/IMG_3737.jpeg?raw=true", bg "#f8f8f8" },
    { id: 2, name: "Fiches BP", desc: "1k/Banque_Populaire", price: 25.00, img: "https://github.com/cmxuhq/monshop/blob/main/images/IMG_3732.jpeg?raw=true", bg: "#ffe4f0" },
    { id: 3, name: "Fiches CE", desc: "1k/Caisse_Epargne", price: 25.00, img: "https://github.com/cmxuhq/monshop/blob/main/images/IMG_3736.jpeg?raw=true", bg: "#dbeafe" },
    { id: 4, name: "Fiches CA", desc: "1k/Credit_Agricol", price: 30.00, img: "https://github.com/cmxuhq/monshop/blob/main/images/IMG_3733.jpeg?raw=true", bg: "#fef9c3" },
    { id: 5, name: "Fiches LBP", desc: "1k/La_Banque_Postal", price: 25.00, img: "https://github.com/cmxuhq/monshop/blob/main/images/IMG_3731.jpeg?raw=true", bg: "#dcfce7" },
    { id: 6, name: "Fiches BNP", desc: "1k/BNP_Paribas", price: 25.00, img: "https://github.com/cmxuhq/monshop/blob/main/images/IMG_3738.jpeg?raw=true", bg: "#f3e8ff" },
    { id: 7, name: "Fiches CIC", desc: "1k/CIC", price: 25.00, img: "https://github.com/cmxuhq/monshop/blob/main/images/IMG_3746.jpeg?raw=true", bg: "#a3e6f2" },
  ];

  let cart = {};

  function renderProducts() {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = products.map(p => `
      <div class="card">
        <div class="card-img" style="background:${p.bg}">${p.emoji}</div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.desc}</div>
          <div class="card-footer">
            <div class="price">${p.price.toFixed(2)}€</div>
            <button class="add-btn" onclick="addToCart(${p.id})">+</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    updateCartCount();
  }

  function removeFromCart(id) {
    if (cart[id] > 1) cart[id]--;
    else delete cart[id];
    renderCart();
    updateCartCount();
  }

  function updateCartCount() {
    const total = Object.values(cart).reduce((a, b) => a + b, 0);
    document.getElementById('cartCount').textContent = total;
  }

  function openCart() {
    renderCart();
    document.getElementById('cartOverlay').classList.add('open');
  }

  function closeCart() {
    document.getElementById('cartOverlay').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('cartOverlay')) closeCart();
  }

  function renderCart() {
    const itemsEl = document.getElementById('cartItems');
    const footerEl = document.getElementById('cartFooter');
    const keys = Object.keys(cart);

    if (keys.length === 0) {
      itemsEl.innerHTML = `<div class="empty-cart"><div class="icon">🛒</div>Ton panier est vide</div>`;
      footerEl.innerHTML = '';
      return;
    }

    let total = 0;
    itemsEl.innerHTML = keys.map(id => {
      const p = products.find(x => x.id == id);
      const qty = cart[id];
      const sub = p.price * qty;
      total += sub;
      return `
        <div class="cart-item">
          <div class="cart-item-emoji">${p.emoji}</div>
          <div class="cart-item-info">
            <div class="cart-item-name">${p.name}</div>
            <div class="cart-item-price">${sub.toFixed(2)}€</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="removeFromCart(${id})">−</button>
            <span class="qty-num">${qty}</span>
            <button class="qty-btn" onclick="addToCart(${id}); renderCart()">+</button>
          </div>
        </div>
      `;
    }).join('');

    footerEl.innerHTML = `
      <div class="cart-total">
        <span>Total</span>
        <span>${total.toFixed(2)}€</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Passer commande →</button>
    `;
  }

  function checkout() {
    const keys = Object.keys(cart);
    if (keys.length === 0) return;
    let total = 0;
    keys.forEach(id => {
      const p = products.find(x => x.id == id);
      total += p.price * cart[id];
    });
    if (tg) {
      tg.sendData(JSON.stringify({ cart, total: total.toFixed(2) }));
    } else {
      alert("Commande envoyée ! Total: " + total.toFixed(2) + "€");
    }
  }

  renderProducts();
</script>

</body>
</html>
